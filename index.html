<style>

.stepper{display:flex;gap:8px;align-items:center}

.kv{display:flex;gap:10px;margin:8px 0}
.kv>div{flex:1;background:var(--mute-bg);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--sub)}
.kv b{display:block;font-size:22px;color:var(--text)}
.item{border-left:6px solid var(--line);padding:10px 10px 10px 12px;margin:8px 0;background:var(--card);border-radius:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.item.match{border-left-color:var(--ok);background:linear-gradient(0deg,var(--ok-bg),var(--ok-bg))}
.item.short{border-left-color:var(--warn);background:linear-gradient(0deg,var(--warn-bg),var(--warn-bg))}
.item.over,.item.extra{border-left-color:var(--bad);background:linear-gradient(0deg,var(--bad-bg),var(--bad-bg))}
.item.hot{outline:3px solid var(--pri)}
.item .nums{font-size:15px}
.item .nums b{font-size:20px}
.mini{display:flex;gap:6px;align-items:center}
.mini button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700}
.banner{border-radius:14px;padding:14px;text-align:center;font-size:26px;font-weight:800;margin:10px 0}

#modal h2{margin:0 0 6px;font-size:18px}
.hint{background:var(--mute-bg);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--sub)}
.err{color:var(--bad);font-size:14px}
.pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--mute-bg);border-radius:10px;padding:8px 10px;word-break:break-all}
table.t{width:100%;border-collapse:collapse;font-size:14px}

.quick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

.rc{font-family:ui-monospace,Menlo,"Hiragino Sans",monospace;font-size:13px;line-height:1.5;background:#fff;color:#111;border:1px dashed #999;border-radius:6px;padding:12px;max-width:340px;margin:0 auto}

.rc .c{text-align:center}.rc .r{display:flex;justify-content:space-between;gap:8px}
.rc hr{border:0;border-top:1px dashed #999;margin:6px 0}
.rc .sm{font-size:11px;color:#444}
.rc .ln{margin:2px 0}
#printArea{display:none}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .rc{border:0;max-width:80mm;margin:0;padding:0;font-size:12px}
}

.cl .ctl{display:flex;gap:8px;align-items:center;width:100%;justify-content:space-between}

#camBox{height:clamp(120px,22vh,220px)}

    return s.replace(/^﻿/, '');
  }

  function parseFragment(hash) {
    const h = String(hash || '').replace(/^#/, '');
    if (!h) return null;
    const p = new URLSearchParams(h);
    const gas = p.get('gas'), token = p.get('token');
    if (!gas && !token) return null;
    return { gas: gas || undefined, token: token || undefined };
  }

  function gasUrlProblem(u) {
    u = String(u || '').trim();
    if (!u) return '未入力です';
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)) {
      if (/\/dev$/.test(u)) return '末尾が /dev です。デプロイ後の /exec のURLを入れてください';
      return 'https://script.google.com/macros/s/…/exec の形式ではありません';
    }
    return '';
  }

  function rgbaToGray(data, w, h) {
    const g = new Uint8ClampedArray(w * h);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (data[j] * 299 + data[j + 1] * 587 + data[j + 2] * 114) / 1000;
    return g;

  function rotate90Gray(g, w, h) {
    const out = new Uint8ClampedArray(w * h);

    return out;
  }

  function cropRegion(vw, vh, bw, bh) {
    const boxAr = bw / bh, vidAr = vw / vh;
    let visW, visH, visX, visY;
    if (vidAr > boxAr) { visH = vh; visW = vh * boxAr; visX = (vw - visW) / 2; visY = 0; }
    else { visW = vw; visH = vw / boxAr; visX = 0; visY = (vh - visH) / 2; }
    return { x: Math.round(visX + visW * 0.04), y: Math.round(visY + visH * 0.22), w: Math.round(visW * 0.92), h: Math.round(visH * 0.56) };
  }

  function createDecoder(ZX, kind) {
    const hints = new Map();
    const BF = ZX.BarcodeFormat;
    hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, kind === 'code'
      ? [BF.EAN_13, BF.EAN_8, BF.UPC_A, BF.CODE_128, BF.CODE_39, BF.QR_CODE, BF.ITF, BF.CODABAR]

    reader.setHints(hints);
    // ZXingは「バーコードなし」のたびに警告をconsoleへ出す（毎フレーム出て邪魔になる）ので、その警告だけ捨てる
    const quiet = function (fn) {
      if (typeof console === 'undefined') return fn();
      const w = console.warn, l = console.log;
      const filt = function (orig) { return function () { if (typeof arguments[0] === 'string' && arguments[0].indexOf('MultiFormatReader') === 0) return; return orig.apply(console, arguments); }; };
      console.warn = filt(w); console.log = filt(l);
      try { return fn(); } finally { console.warn = w; console.log = l; }
    };

      try {
        const src = new ZX.RGBLuminanceSource(gray, w, h);

  function toCsv(header, rows) {
    const cell = function (v) {
      let t = v === null || v === undefined ? '' : String(v);
      if (/^[=+@\t\r]/.test(t)) t = "'" + t;
      return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };

  }

  /* ---------- お金の計算（GASの calcCart_ と同じ式。テストで一致を確かめる） ---------- */
  var RATE_LABEL = { 8: '8%', 10: '10%' };
  var PAY_METHODS = ['現金', 'カード', 'その他'];
  var ROUND_MODES = ['切り捨て', '切り上げ', '四捨五入'];

  /** 整数の割り算の端数処理（num≧0, den>0）。0.5は切り上げ */
  function roundDiv(num, den, mode) {
    if (mode === '切り上げ') return Math.floor((num + den - 1) / den);
    if (mode === '四捨五入') return Math.floor((2 * num + den) / (2 * den));
    return Math.floor(num / den);
  }
  /** 値引・割引の額（0〜基準額）。disc: {type:'yen'|'pct', value}。％は切り捨て */
  function discountAmount(base, disc) {
    if (!disc || !disc.value) return 0;
    const v = Number(disc.value);
    if (disc.type === 'pct') return Math.min(base, Math.floor(base * v / 100));
    return Math.min(base, v);
  }
  /** 税込の対価（税率別の合計）から内税額を出す。符号つき。1書類につき税率ごとに1回だけ端数処理 */
  function taxInner(amount, rate, mode) {
    const sign = amount < 0 ? -1 : 1;
    return sign * roundDiv(Math.abs(amount) * rate, 100 + rate, mode);
  }
  /** カートの計算。lines: [{price(税込), qty, rate, disc}]、subDisc: 小計の値引・割引 */
  function calcCart(lines, subDisc, mode) {
    const out = []; let subtotal = 0;
    lines.forEach(function (l) {
      const gross = l.price * l.qty;
      const d = discountAmount(gross, l.disc);
      const net = gross - d;
      out.push({ gross: gross, lineDisc: d, net: net, alloc: 0, amount: net, rate: l.rate });
      subtotal += net;
    });
    const sd = discountAmount(subtotal, subDisc);
    if (sd > 0 && subtotal > 0) {
      let used = 0; const frac = [];
      out.forEach(function (o, i) {
        const num = o.net * sd;
        o.alloc = Math.floor(num / subtotal);
        used += o.alloc;
        frac.push({ i: i, r: num % subtotal });
      });
      frac.sort(function (a, b) { return b.r - a.r || a.i - b.i; });
      for (let k = 0; k < sd - used; k++) out[frac[k].i].alloc++;
      out.forEach(function (o) { o.amount = o.net - o.alloc; });
    }
    const byRate = { 8: 0, 10: 0 }; let total = 0;
    out.forEach(function (o) { byRate[o.rate] += o.amount; total += o.amount; });
    return { lines: out, subtotal: subtotal, subDisc: sd, total: total, byRate: byRate, tax: { 8: taxInner(byRate[8], 8, mode), 10: taxInner(byRate[10], 10, mode) } };
  }
  /** 円の表示（マイナスは -¥1,000） */
  function fmtYen(n) { if (n === null || n === undefined || n === '') return ''; const v = Number(n); return (v < 0 ? '-' : '') + '¥' + Math.abs(v).toLocaleString('ja-JP'); }
  /** 税率ごとの対価（税込）の合計を、明細から出す（レシート用。マイナス可） */
  function byRateOf(lines) { const r = { 8: 0, 10: 0 }; lines.forEach(function (l) { r[l.rate] += l.amount; }); return r; }
  /** 登録番号の形（T＋13桁）。全角・ハイフンは直す。だめなら null */
  function normRegNo(v) { const s = nfkc(v == null ? '' : v).replace(/[\s\-]/g, '').toUpperCase(); return /^T\d{13}$/.test(s) ? s : (s === '' ? '' : null); }
  /** 取引IDの作り方（画面で作る二重送信防止のキー。8〜64文字） */
  function newTxKey(now, rnd) { return 'k' + now.toString(36) + '-' + rnd.toString(36).slice(2, 10).padEnd(8, '0'); }
  /** 会計の入力の確認（画面側）: 預り金とお釣り */
  function changeOf(total, received) { return received - total; }
  /** 商品CSV（JAN,商品名,単価[,税率区分[,在庫]]）の1行を作る（書き出し用） */
  function toNum(v) { const n = Number(nfkc(v == null ? '' : v).replace(/[¥円,\s]/g, '')); return isFinite(n) ? n : NaN; }

  return { nfkc, janDigits, janKey, checkDigitOk, validateJan, yen, splitCells, decodeBytes, parseFragment, gasUrlProblem, rgbaToGray, rotate90Gray, cropRegion, createDecoder, toCsv,
    roundDiv, discountAmount, taxInner, calcCart, fmtYen, byRateOf, normRegNo, newTxKey: newTxKey, changeOf, toNum, RATE_LABEL, PAY_METHODS, ROUND_MODES };
})();

class ApiError extends Error { constructor(code, message, data) { super(message); this.code = code; this.data = data || {}; } }

async function api(action, payload, method) {
  payload = payload || {}; method = method || 'POST';
  if (!S.cfg.gas) throw new ApiError('config', '設定（⚙）でGASのURLと合言葉を入れてください');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  let res, text;
  try {
    if (method === 'GET') {
      const u = new URL(S.cfg.gas);
      u.searchParams.set('action', action);
      if (action !== 'ping') u.searchParams.set('token', S.cfg.token);
      Object.keys(payload).forEach((k) => { if (payload[k] !== undefined && payload[k] !== null) u.searchParams.set(k, payload[k]); });
      res = await fetch(u.toString(), { signal: ctrl.signal, redirect: 'follow' });
    } else {
      // text/plain にして、ブラウザの事前確認（プリフライト）を避ける
      res = await fetch(S.cfg.gas, {
        method: 'POST', redirect: 'follow', signal: ctrl.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action, token: S.cfg.token }, payload))
      });
    }
    text = await res.text();
  } catch (e) {
    if (e.name === 'AbortError') throw new ApiError('timeout', '通信がタイムアウトしました（30秒）');
    throw new ApiError('network', '通信できません（' + (e.message || e) + '）。URLの公開設定（全員）と電波を確認してください');
  } finally { clearTimeout(timer); }
  let data;
  try { data = JSON.parse(text); } catch (e) {
    throw new ApiError('not_json', 'GASがJSONを返しませんでした。URLが /exec か、公開設定が「全員」か確認してください');
  }
  if (!data.ok) throw new ApiError(data.error || 'error', data.message || '失敗しました', data);
  return data;
}

function errText(e) {
  if (e instanceof ApiError) {
    const map = { unauthorized: '合言葉が違います', insufficient_stock: '在庫が足りません', not_in_master: 'マスタにないJANがあります', already_imported: '取り込み済みです', busy: '他の処理中です。もう一度押してください' };
    return (map[e.code] || '') && (map[e.code] + (e.data && e.data.message ? '：' + e.data.message : '')) || e.message;
  }
  return e && e.message ? e.message : String(e);
}

    o.type = 'sine'; o.frequency.value = kind === 'ng' ? 220 : (kind === 'ok' ? 1320 : 1040);
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);

    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (kind === 'ng' ? 0.28 : 0.12));

  } catch (e) { }
}

async function findItem(jan) {
  const hit = S.master.get(Logic.janKey(jan));
  if (hit) return hit;
  const r = await api('masterGet', { jan: jan }, 'GET');
  if (r.found) { putItem(r.item); return S.master.get(Logic.janKey(jan)); }
  return null;
}
async function loadSettings() {
  if (!S.cfg.gas) return;
  try { S.settings = await api('settingsGet', {}, 'GET'); } catch (e) { S.settings = null; }
  renderStatus();
}
const roundModeNow = () => (S.settings && S.settings.values && S.settings.values['税の端数処理']) || '切り捨て';
const persistCart = () => store.set('pos.cart', S.cart);

/* ---------- スキャン結果の処理 ---------- */
function handleDetected(text) {
  const now = Date.now(), last = S.cam.last;
  const same = text === last.text && now - last.t < 1000;
  last.text = text; last.t = now;
  if (same || S.modal || S.sending || S.scanBusy) return;
  onScan(text);
}
async function onScan(raw) {
  const v = Logic.validateJan(raw);
  if (!v.ok) { beep('ng'); toast(v.reason + '：' + raw, 'warn'); return; }
  onDetected();
  S.scanBusy = true;
  try {
    let item = null;
    try { item = await findItem(v.jan); } catch (e) { toast(errText(e), 'bad'); return; }
    const m = S.mode;
    if (m === 'sale') {
      if (item) { addToCart(item); speakItem(item); }
      else { beep('ng'); openNotFound(v.jan); }
    } else if (m === 'item') {
      if (item) openItemForm(item); else { beep('ng'); openItemForm({ jan: v.jan, isNew: true }); }
    } else if (m === 'recv') {
      if (!item) { beep('ng'); openItemForm({ jan: v.jan, isNew: true }); return; }
      const l = S.rcv.lines.find((x) => Logic.janKey(x.jan) === Logic.janKey(item.jan));
      if (l) l.qty += 1; else S.rcv.lines.unshift({ jan: item.jan, name: item.name, qty: 1 });
      beep('ok'); renderPanel();
    } else if (m === 'stk') {
      if (!item) { beep('ng'); openItemForm({ jan: v.jan, isNew: true }); return; }
      const l = S.stk.lines.find((x) => Logic.janKey(x.jan) === Logic.janKey(item.jan));
      if (l) l.actual += 1; else S.stk.lines.unshift({ jan: item.jan, name: item.name, book: item.stock, actual: 1 });
      S.stk.preview = null; beep('ok'); renderPanel();
    }
  } finally { S.scanBusy = false; kbdFocus(); }
}
function speakItem(item) { speak(item.name + ' ' + (item.price === null ? '' : item.price + '円')); }

/* ---------- 共通の部品 ---------- */
const hint = (h) => '<div class="hint">' + h + '</div>';
function seg(items, cur, act) { return '<div class="seg">' + items.map((i) => '<button class="' + (cur === i[0] ? 'on' : '') + '" data-act="' + act + '" data-t="' + i[0] + '">' + esc(i[1]) + '</button>').join('') + '</div>'; }
function noConfigHint() { return hint('右上の ⚙ で、GASのURLと合言葉を入れてください。入れ終わると、商品マスタが自動で読み込まれます。'); }
const rateTag = (r) => (r === 8 ? '<span class="tg">軽減8%</span>' : '');
const tdy = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
function newKey() { return Logic.newTxKey(Date.now(), Math.random()); }

/* ---------- レジ ---------- */
function cartCalc() {
  return Logic.calcCart(S.cart.lines.map((l) => ({ price: l.price, qty: l.qty, rate: l.rate, disc: l.disc || null })), S.cart.subDisc || null, roundModeNow());
}
function addToCart(item) {
  if (item.price === null || item.price === undefined) { beep('ng'); toast('単価が未設定の商品です：' + item.name + '（商品タブで単価を入れてください）', 'warn'); return; }
  const same = S.cart.lines.find((l) => !l.unreg && Logic.janKey(l.jan) === Logic.janKey(item.jan) && !l.disc);
  if (same) same.qty += 1;
  else {
    if (S.cart.lines.length >= 100) { toast('1会計の明細は100行までです', 'warn'); return; }
    S.cart.lines.push({ jan: item.jan, name: item.name, price: item.price, rate: item.rate, qty: 1, disc: null, unreg: false });
  }
  S.cart.txKey = ''; persistCart(); renderPanel();
}
function renderSale() {

  const q = Logic.nfkc(S.q || '').toLowerCase().trim();

    '<button class="btn sm" data-act="unreg">未登録商品</button>' +
    (n ? '<button class="btn sm danger" data-act="cartClear">全部取消</button>' : '') + '</div>';
  if (!n) h += '<div class="sub" style="margin-top:6px">バーコードを読むか、下の商品ボタンを押してください。</div>';
  S.cart.lines.forEach((l, i) => {
    const o = c.lines[i];
    h += '<div class="line cl"><div class="nm"><b>' + esc(l.name) + '</b>' + rateTag(l.rate) + (l.unreg ? '<span class="tg off">未登録</span>' : '') +
      '<div class="sub">' + Logic.fmtYen(l.price) + ' × ' + l.qty + (l.disc ? '　<b style="color:var(--warn)">' + (l.disc.type === 'pct' ? l.disc.value + '%引' : Logic.fmtYen(l.disc.value) + '引') + '</b>' : '') + '</div></div>' +
      '<div class="ctl"><button class="btn sm" data-act="lineDisc" data-i="' + i + '">値引</button>' +
      '<div class="mini"><button data-act="lineQty" data-i="' + i + '" data-d="-1">−</button><b style="min-width:24px;text-align:center">' + l.qty + '</b><button data-act="lineQty" data-i="' + i + '" data-d="1">＋</button></div>' +
      '<div class="amt">' + Logic.fmtYen(o.net) + '</div><button class="btn sm" data-act="lineDel" data-i="' + i + '" aria-label="削除">✕</button></div></div>';
  });
  if (n) {
    h += '<div class="bigrow"><span>小計</span><b>' + Logic.fmtYen(c.subtotal) + '</b></div>' +
      '<div class="bigrow"><span>小計の値引・割引' + (S.cart.subDisc ? '（' + (S.cart.subDisc.type === 'pct' ? S.cart.subDisc.value + '%' : Logic.fmtYen(S.cart.subDisc.value)) + '）' : '') + '</span>' +
      '<span><b style="color:var(--warn)">' + (c.subDisc ? '-' + Logic.fmtYen(c.subDisc) : '') + '</b> <button class="btn sm" data-act="subDisc">値引</button></span></div>' +
      '<div class="bigrow"><span>合計（税込）</span><span class="big">' + Logic.fmtYen(c.total) + '</span></div>' +
      '<div class="sub">10%対象 ' + Logic.fmtYen(c.byRate[10]) + '（内税 ' + Logic.fmtYen(c.tax[10]) + '）／ 軽減8%対象 ' + Logic.fmtYen(c.byRate[8]) + '（内税 ' + Logic.fmtYen(c.tax[8]) + '）</div>' +
      '<button class="btn pri block" style="margin-top:10px;min-height:56px;font-size:18px" data-act="checkout" ' + (S.sending ? 'disabled' : '') + '>お会計へ</button>';
  }
  h += '</div>';
  h += '<div class="card"><div class="row"><input type="search" data-in="saleQ" id="saleQ" placeholder="商品名・JANで絞り込み" value="' + esc(S.q) + '" autocomplete="off"></div>' +
    '<div class="pgrid">' + items.map((i) => '<button class="pbtn" data-act="addItem" data-jan="' + esc(i.jan) + '"><b>' + esc(i.name) + '</b><span>' + (i.price === null ? '単価なし' : Logic.fmtYen(i.price)) + (i.rate === 8 ? ' ※' : '') + '　在庫' + i.stock + '</span></button>').join('') + '</div>' +
    (S.master.size > 60 && !q ? '<div class="sub" style="margin-top:6px">先頭の60品を表示しています。絞り込みを使ってください。</div>' : '') +
    (!S.master.size ? '<div class="sub" style="margin-top:6px">商品がまだありません。商品タブで登録・取り込みをしてください。</div>' : '') + '</div>';
  return h;
}
function openDiscModal(title, cur, onOk) {
  S.discCb = onOk;
  openModal('<h2>' + esc(title) + '</h2>' +
    seg([['yen', '円で引く'], ['pct', '％で割引']], (cur && cur.type) || 'yen', 'discType') +
    '<label class="f">値（円 または ％）。0で解除</label><input type="number" class="numin" id="discVal" inputmode="numeric" min="0" value="' + (cur ? cur.value : '') + '">' +
    '<div class="row" style="margin-top:12px"><button class="btn grow" data-act="closeModal">戻る</button><button class="btn pri grow" data-act="discOk">決定</button></div>');
  S.discType = (cur && cur.type) || 'yen';
}
function discOk() {
  const v = Math.floor(Number($('#discVal').value));
  if (!isFinite(v) || v < 0 || (S.discType === 'pct' && v > 100)) { toast('値が正しくありません（％は0〜100の整数）', 'warn'); return; }
  const cb = S.discCb; S.discCb = null; closeModal();
  cb(v === 0 ? null : { type: S.discType, value: v });
}
function openUnreg(jan) {
  S.unreg = { rate: 10 };
  openModal('<h2>未登録商品を売る</h2><div class="sub">マスタに無い商品の売上を、その場の金額で記録します（在庫は動きません）。' + (jan ? '<br>読み取ったJAN: ' + esc(jan) : '') + '</div>' +
    '<label class="f">金額（税込・1個あたり）</label><input type="number" class="numin" id="unrPrice" inputmode="numeric" min="1">' +
    '<label class="f">数量</label><input type="number" id="unrQty" inputmode="numeric" min="1" value="1">' +
    '<label class="f">税率</label>' + seg([['10', '10%'], ['8', '軽減8%']], '10', 'unrRate') +
    '<div class="row" style="margin-top:12px"><button class="btn grow" data-act="closeModal">戻る</button><button class="btn pri grow" data-act="unrOk">カートに入れる</button></div>');
}
function unrOk() {
  const price = Math.floor(Number($('#unrPrice').value)), qty = Math.floor(Number($('#unrQty').value));
  if (!(price >= 1) || price > 9999999) { toast('金額は1〜9,999,999円で入れてください', 'warn'); return; }
  if (!(qty >= 1)) { toast('数量は1以上です', 'warn'); return; }
  S.cart.lines.push({ jan: '', name: '未登録商品', price: price, rate: S.unreg.rate, qty: qty, disc: null, unreg: true });
  S.cart.txKey = ''; persistCart(); closeModal(); renderPanel();
}
function openNotFound(jan) {
  openModal('<h2>マスタにない商品です</h2><div class="sub">JAN ' + esc(jan) + '</div>' +
    '<div class="row wrap" style="margin-top:12px"><button class="btn pri grow" data-act="nfUnreg" data-jan="' + esc(jan) + '">未登録商品として売る</button>' +
    '<button class="btn grow" data-act="nfReg" data-jan="' + esc(jan) + '">商品として登録</button></div>' +
    '<button class="btn block" style="margin-top:8px" data-act="closeModal">閉じる</button>');
}

/* ---------- お会計 ---------- */
function openCheckout() {
  if (!S.cart.lines.length) return;
  if (!S.cart.txKey) { S.cart.txKey = newKey(); persistCart(); }
  const c = cartCalc();
  S.co = { method: '現金', received: c.total, guests: 1, total: c.total };
  const ready = S.settings && S.settings.invoiceReady;
  openModal('<h2>お会計</h2>' +
    '<div class="bigrow"><span>合計（税込）</span><span class="big">' + Logic.fmtYen(c.total) + '</span></div>' +
    '<div class="sub">10%対象 ' + Logic.fmtYen(c.byRate[10]) + '（内税 ' + Logic.fmtYen(c.tax[10]) + '）／ 軽減8%対象 ' + Logic.fmtYen(c.byRate[8]) + '（内税 ' + Logic.fmtYen(c.tax[8]) + '）</div>' +
    (ready ? '' : '<div class="hint" style="margin-top:6px">登録番号が未設定です。レシートは、適格簡易請求書にはなりません（⚙ の設定で入れられます）。</div>') +
    '<label class="f">支払方法</label>' + seg(Logic.PAY_METHODS.map((m) => [m, m]), '現金', 'coMethod') +
    '<div id="coCash"><label class="f">預り金</label><input type="number" class="numin" id="coRecv" data-in="coRecv" inputmode="numeric" min="0" value="' + c.total + '">' +
    '<div class="quick"><button class="btn" data-act="coJust">ちょうど</button><button class="btn" data-act="coAdd" data-v="1000">1,000</button><button class="btn" data-act="coAdd" data-v="5000">5,000</button><button class="btn" data-act="coAdd" data-v="10000">10,000</button></div>' +
    '<div class="bigrow"><span>お釣り</span><span class="big" id="coChange">¥0</span></div></div>' +
    '<label class="f">客数（入力なしは1人）</label><div class="stepper"><button data-act="coGuest" data-d="-1">−</button><input type="number" id="coGuests" data-in="coGuests" inputmode="numeric" min="0" value="1"><button data-act="coGuest" data-d="1">＋</button></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn grow" data-act="closeModal">戻る</button><button class="btn pri grow" id="coOk" data-act="coConfirm" style="min-height:56px;font-size:18px">会計を確定</button></div>');
  coRefresh();
}
function coRefresh() {
  const co = S.co; if (!co) return;
  const cash = co.method === '現金';
  const box = $('#coCash'); if (box) box.style.display = cash ? '' : 'none';
  const ch = $('#coChange'), ok = $('#coOk');
  const diff = Logic.changeOf(co.total, co.received);
  if (ch) { ch.textContent = Logic.fmtYen(Math.max(0, diff)); ch.style.color = cash && diff < 0 ? 'var(--bad)' : ''; }
  if (ok) ok.disabled = cash && diff < 0;
  if (ch && cash && diff < 0) ch.textContent = '不足 ' + Logic.fmtYen(-diff);
}
async function coConfirm() {
  const co = S.co; if (!co || S.sending) return;
  const lines = S.cart.lines.map((l) => l.unreg
    ? { unregistered: true, price: l.price, rate: l.rate === 8 ? '8%' : '10%', qty: l.qty, disc: l.disc || undefined }
    : { jan: l.jan, qty: l.qty, disc: l.disc || undefined });
  const payload = { txKey: S.cart.txKey, lines: lines, method: co.method, guests: co.guests, subDisc: S.cart.subDisc || undefined };
  if (co.method === '現金') payload.received = co.received;
  S.sending = true; $('#coOk').disabled = true;
  try {
    const r = await api('saleCreate', payload);
    S.cart = { lines: [], subDisc: null, txKey: '' }; persistCart();
    S.co = null; S.sending = false;
    beep('ok'); buzz(120);
    if (r.negativeStock && r.negativeStock.length) toast('在庫がマイナスになりました：' + r.negativeStock.map((x) => x.name).join('、'), 'warn');
    showReceipt(r, true);
    loadMaster(); renderPanel();
  } catch (e) {
    S.sending = false; const ok = $('#coOk'); if (ok) { ok.disabled = false; coRefresh(); }
    toast(errText(e) + (e.code === 'timeout' || e.code === 'network' ? '（もう一度押しても二重にはなりません）' : ''), 'bad');
  }
}

/* ---------- レシート（適格簡易請求書／適格返還請求書） ---------- */
function receiptHtml(d) {
  const t = d.tx, iss = d.issuer || {};
  const lines = d.lines || [];
  const br = Logic.byRateOf(lines);
  const hasReg = !!Logic.normRegNo(iss.regNo) && !!iss.name;
  const ret = t.status === '返品' || t.status === '取消';
  const title = ret ? (hasReg ? '返品・取消のお知らせ（適格返還請求書）' : '返品・取消のお知らせ') : (hasReg ? '領収書（適格簡易請求書）' : '領収書');
  let h = '<div class="rc"><h3>' + esc(title) + '</h3>';
  if (iss.name) h += '<div class="c"><b>' + esc(iss.name) + '</b></div>';
  if (iss.address) h += '<div class="c sm">' + esc(iss.address) + '</div>';
  if (iss.tel) h += '<div class="c sm">TEL ' + esc(iss.tel) + '</div>';
  h += hasReg ? '<div class="c">登録番号 ' + esc(iss.regNo) + '</div>' : '<div class="c sm">（登録番号が未設定です）</div>';
  h += '<hr><div class="r"><span>' + esc(t.ts) + '</span><span>' + esc(t.id) + '</span></div>';
  if (ret) h += '<div class="sm">元の取引: ' + esc(t.origId) + (t.origTs ? '（' + esc(t.origTs) + '）' : '') + '</div>';
  h += '<hr>';
  lines.forEach((l) => {
    h += '<div class="ln">' + esc(l.name) + (l.rate === 8 ? ' ※' : '') + '</div><div class="r"><span>　' + Logic.fmtYen(l.price) + ' × ' + l.qty + (l.disc ? '（値引 ' + Logic.fmtYen(l.disc) + '）' : '') + '</span><span>' + Logic.fmtYen(l.amount) + '</span></div>';
  });
  h += '<hr><div class="r"><b>' + (ret ? '返還額（税込）' : '合計（税込）') + '</b><b>' + Logic.fmtYen(t.total) + '</b></div>';
  h += '<div class="r"><span>10%対象（税込）</span><span>' + Logic.fmtYen(br[10]) + '</span></div><div class="r"><span>　内消費税等（10%）</span><span>' + Logic.fmtYen(t.tax10) + '</span></div>';
  h += '<div class="r"><span>軽減8%対象（税込）※</span><span>' + Logic.fmtYen(br[8]) + '</span></div><div class="r"><span>　内消費税等（8%）</span><span>' + Logic.fmtYen(t.tax8) + '</span></div>';
  if (!ret) {
    h += '<hr><div class="r"><span>支払方法</span><span>' + esc(t.method) + '</span></div>';
    if (t.method === '現金' && t.received !== null && t.received !== undefined) h += '<div class="r"><span>お預り</span><span>' + Logic.fmtYen(t.received) + '</span></div><div class="r"><span>お釣り</span><span>' + Logic.fmtYen(t.change) + '</span></div>';
  } else h += '<hr><div class="r"><span>返金方法</span><span>' + esc(t.method) + '</span></div>';
  h += '<hr><div class="sm">※は軽減税率（8%）対象' + (d.reissue ? '　【再発行】' : '') + '</div>';
  if (iss.message) h += '<div class="c sm" style="margin-top:4px">' + esc(iss.message) + '</div>';
  return h + '</div>';
}
function showReceipt(d, justPaid) {
  S.rcv_d = d;
  const t = d.tx;
  openModal('<h2>' + (justPaid ? '会計完了' : (t.status === '通常' ? '取引の控え' : '返品・取消の控え')) + '</h2>' +
    (justPaid && t.method === '現金' ? '<div class="banner ok">お釣り ' + Logic.fmtYen(t.change) + '<small>合計 ' + Logic.fmtYen(t.total) + '</small></div>' : '') +
    (d.duplicate ? '<div class="hint">同じ会計がすでに記録されていたため、前の結果を表示しています。</div>' : '') +
    receiptHtml(d) +
    '<div class="row wrap" style="margin-top:10px"><button class="btn grow" data-act="rcPrint">印刷・PDF保存</button><button class="btn pri grow" data-act="closeModal">閉じる</button></div>' +
    '<div class="sub" style="margin-top:6px">写し（控え）は、取引・売上明細のシートに残っています。取引タブから再発行できます。</div>');
}
function printReceipt() {
  if (!S.rcv_d) return;
  $('#printArea').innerHTML = receiptHtml(Object.assign({}, S.rcv_d, { reissue: S.rcv_d.tx.reissue }));
  window.print();
}

/* ---------- 取引（履歴・再発行・取消・返品） ---------- */
async function loadTx() {
  if (!S.cfg.gas) return;
  if (!S.txv.date) S.txv.date = tdy();
  try { const r = await api('saleList', { date: S.txv.date.replace(/-/g, '/'), limit: 100 }, 'GET'); S.txv.rows = r.rows; } catch (e) { S.txv.rows = []; toast(errText(e), 'bad'); }
  renderPanel();
}
function renderTx() {
  if (!S.cfg.gas) return noConfigHint();
  const v = S.txv;
  let h = '<div class="card"><div class="row"><input type="date" id="txDate" data-in="txDate" value="' + esc(v.date || tdy()) + '"><button class="btn sm" data-act="txReload">更新</button></div></div>';
  if (v.rows === null) return h + hint('読み込み中…');
  if (!v.rows.length) return h + hint('この日の取引はありません。');
  h += '<div class="card" style="padding:4px 12px">' + v.rows.map((r) => '<div class="line" data-act="txOpen" data-id="' + esc(r.id) + '" style="cursor:pointer"><div class="nm"><b>' + esc(r.ts.slice(11, 16)) + '　' + esc(r.id) + '</b><div class="sub">' + esc(r.method) + (r.guests ? '　' + r.guests + '人' : '') + (r.origId ? '　元: ' + esc(r.origId) : '') + '</div></div><span class="tag ' + (r.status === '通常' ? 'ok' : (r.status === '取消済' ? 'bad' : 'warn')) + '">' + esc(r.status) + '</span><div class="amt" style="' + (r.total < 0 ? 'color:var(--warn)' : '') + '">' + Logic.fmtYen(r.total) + '</div></div>').join('') + '</div>';
  return h;
}
async function txOpen(id) {
  try {
    const d = await api('saleGet', { id: id }, 'GET');
    d.reissue = true; d.tx.reissue = true; S.txd = d;
    const t = d.tx, orig = t.status === '通常' && !d.archived;
    openModal('<h2>' + esc(t.id) + ' <span class="tag ' + (t.status === '通常' ? 'ok' : 'warn') + '">' + esc(t.status) + '</span></h2>' + receiptHtml(d) +
      '<div class="row wrap" style="margin-top:10px"><button class="btn grow" data-act="txPrint">再発行（印刷・PDF）</button>' +

function rpPreset(which) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  const ymd = (x) => x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
  if (which === 'last') { S.settle.from = ymd(new Date(y, m - 1, 1)); S.settle.to = ymd(new Date(y, m, 0)); }
  else { S.settle.from = ymd(new Date(y, m, 1)); S.settle.to = tdy(); }
}
async function downloadReport() {
  const s = S.settle;
  if (!s.from || !s.to) return toast('期間を入れてください', 'warn');
  if (s.from > s.to) return toast('開始日が終了日より後です', 'warn');
  try {
    const r = await api('dailyReport', { from: s.from, to: s.to }, 'GET');
    if (!r.rows.length) return toast('この期間に取引はありません', 'warn');
    const csv = Logic.toCsv(r.header, r.rows.concat([r.total]));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })); a.download = '簡易POS_日別売上_' + s.from.replace(/-/g, '') + '-' + s.to.replace(/-/g, '') + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('日別の売上CSV（' + r.days + '日分）を作りました。最終行は合計です', 'ok');
    if (r.truncated) toast('取引が多いため、期間の先頭の日が集計に入っていない可能性があります（直近3,000件まで集計します）', 'warn');
    if (r.archiveError) toast('アーカイブを開けなかった日付があります: ' + r.archiveError, 'warn');
  } catch (e) { toast(errText(e), 'bad'); }
}
async function downloadCsv(kind) {

    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })); a.download = '簡易POS_' + r.title + '_' + ymd + '.csv';

}

async function runDiag() {
  const L = [];
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  L.push('表示モード: ' + (standalone ? 'ホーム画面アプリ（standalone）' : 'ブラウザ表示'));
  L.push('HTTPS等（secure context）: ' + (window.isSecureContext ? 'はい' : 'いいえ ← カメラは使えません'));
  L.push('URL: ' + location.protocol + '//' + location.host);
  L.push('mediaDevices: ' + (navigator.mediaDevices ? 'あり' : 'なし'));
  L.push('getUserMedia: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'あり' : 'なし'));
  L.push('ZXing-js: ' + (window.ZXing ? '読み込み済み' : '未読込（CDNに届いていません）'));
  L.push('BarcodeDetector: ' + ('BarcodeDetector' in window ? 'あり' : 'なし（使いません）'));
  L.push('バイブ: ' + (navigator.vibrate ? 'あり' : 'なし'));
  L.push('読み上げ: ' + (window.speechSynthesis ? 'あり（日本語の声 ' + speechSynthesis.getVoices().filter((v) => /^ja/i.test(v.lang)).length + ' 個）' : 'なし'));
  try {
    if (navigator.permissions && navigator.permissions.query) { const p = await navigator.permissions.query({ name: 'camera' }); L.push('カメラ許可: ' + p.state); }
    else L.push('カメラ許可: 取得できません（この環境）');
  } catch (e) { L.push('カメラ許可: 取得できません'); }
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      const d = (await navigator.mediaDevices.enumerateDevices()).filter((x) => x.kind === 'videoinput'); L.push('カメラ台数: ' + d.length);
    }
  } catch (e) { }
  L.push('カメラ状態: ' + S.cam.state + (S.cam.lastError ? '\n直近のエラー: ' + S.cam.lastError : ''));
  L.push('端末: ' + navigator.userAgent);

}

async function readPhoto(file) {
  if (!file) return;
  if (!Scanner.ready()) { toast('ZXing-js を読み込めていません', 'bad'); return; }
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('画像を開けません')); i.src = url; });
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
    let text = null;
    for (const maxW of [1600, 1000, 640]) {
      const sc = Math.min(1, maxW / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
      cv.width = w; cv.height = h; ctx.drawImage(img, 0, 0, w, h);
      const gray = Logic.rgbaToGray(ctx.getImageData(0, 0, w, h).data, w, h);
      const dec = S.codeScan ? Scanner.decodeCode : Scanner.decode;
      text = dec(gray, w, h) || dec(Logic.rotate90Gray(gray, w, h), h, w);
      if (text) break;
    }
    URL.revokeObjectURL(url);
    if (!text) { beep('ng'); toast('バーコードを読み取れませんでした。バーコードを大きく、水平に撮ってください', 'warn'); return; }
    onScan(text);
  } catch (e) { toast(errText(e), 'bad'); }
}

  lineDisc(d) { const l = S.cart.lines[Number(d.i)]; if (l) openDiscModal('「' + l.name + '」の値引・割引', l.disc, (v) => { l.disc = v; S.cart.txKey = ''; persistCart(); renderPanel(); }); },
  subDisc() { openDiscModal('小計の値引・割引', S.cart.subDisc, (v) => { S.cart.subDisc = v; S.cart.txKey = ''; persistCart(); renderPanel(); }); },
  discType(d) { S.discType = d.t; document.querySelectorAll('[data-act=discType]').forEach((b) => b.classList.toggle('on', b.dataset.t === d.t)); },
  discOk() { discOk(); },
  async cartClear() { if (await confirmDialog({ title: 'カートを空にする', ok: '空にする', danger: true, body: 'カートの中身をすべて取り消します（会計はまだ記録されていません）。' })) { S.cart = { lines: [], subDisc: null, txKey: '' }; persistCart(); renderPanel(); } },
  unreg() { openUnreg(''); },
  unrRate(d) { S.unreg.rate = Number(d.t); document.querySelectorAll('[data-act=unrRate]').forEach((b) => b.classList.toggle('on', b.dataset.t === d.t)); },
  unrOk() { unrOk(); },
  nfUnreg(d) { closeModal(); openUnreg(d.jan); },
  nfReg(d) { closeModal(); openItemForm({ jan: d.jan, isNew: true }); },
  checkout() { unlockMedia(); openCheckout(); },
  coMethod(d) { S.co.method = d.t; document.querySelectorAll('[data-act=coMethod]').forEach((b) => b.classList.toggle('on', b.dataset.t === d.t)); coRefresh(); },
  coJust() { S.co.received = S.co.total; $('#coRecv').value = S.co.total; coRefresh(); },
  coAdd(d) { S.co.received = (Number($('#coRecv').value) || 0) + Number(d.v); if (Number(d.v) >= S.co.total && !Number($('#coRecv').dataset.touched)) S.co.received = Number(d.v); $('#coRecv').value = S.co.received; coRefresh(); },
  coGuest(d) { S.co.guests = Math.max(0, Math.min(999, (Number($('#coGuests').value) || 0) + Number(d.d))); $('#coGuests').value = S.co.guests; },
  coConfirm() { coConfirm(); },
  rcPrint() { printReceipt(); },
  // 取引
  txReload() { loadTx(); },
  arcPreview() { arcRun(true); },
  arcRun() { arcRun(false); },
  arcSearch() { arcSearch(); },
  txOpen(d) { txOpen(d.id); },
  txPrint() { S.rcv_d = S.txd; printReceipt(); },
  txVoid() { txVoid(); },
  txReturn() { txReturnOpen(); },
  retQty(d) { const k = d.l; const max = Number(d.max || 0); const cur = S.ret[k] || 0; let n = cur + Number(d.d); if (n < 0) n = 0; const lim = (S.txd.lines.find((x) => String(x.line) === String(k)) || {}).remaining || 0; if (n > lim) n = lim; S.ret[k] = n; $('#ret' + k).textContent = n; },
  retOk() { retOk(); },
  // 精算・CSV
  stReload() { loadSettle(); },
  csv(d) { downloadCsv(d.kind); },
  rpThis() { rpPreset('this'); renderPanel(); },
  rpLast() { rpPreset('last'); renderPanel(); },
  rpCsv() { downloadReport(); },
  // 商品
  itemNew() { openItemForm({ jan: '', isNew: true }); },
  itemEdit(d) { const it = S.master.get(Logic.janKey(d.jan)); if (it) openItemForm(it); },
  ifRate(d) { S.itemForm.rate = Number(d.t); document.querySelectorAll('[data-act=ifRate]').forEach((b) => b.classList.toggle('on', b.dataset.t === d.t)); },
  ifSave() { ifSave(); },
  impFile() { $('#impFile').click(); },
  impRun() { runImport($('#impText').value); },
  // 入荷・棚卸
  rcvQty(d) { const l = S.rcv.lines[Number(d.i)]; if (l) { l.qty = Math.max(0, l.qty + Number(d.d)); renderPanel(); } },
  rcvDel(d) { S.rcv.lines.splice(Number(d.i), 1); renderPanel(); },
  rcvClear() { S.rcv = { lines: [], memo: '' }; renderPanel(); },
  rcvOk() { rcvOk(); },
  stkQty(d) { const l = S.stk.lines[Number(d.i)]; if (l) { l.actual = Math.max(0, l.actual + Number(d.d)); renderPanel(); } },
  stkDel(d) { S.stk.lines.splice(Number(d.i), 1); renderPanel(); },
  stkClear() { S.stk = { lines: [], name: '', preview: null }; renderPanel(); },
  stkOk() { stkOk(); }
};
const Inputs = {
  saleQ(el) { S.q = el.value; renderPanel(); },
  itemQ(el) { S.itemQ = el.value; renderPanel(); },
  coRecv(el) { el.dataset.touched = '1'; S.co.received = Number(el.value) || 0; coRefresh(); },
  coGuests(el) { S.co.guests = Math.max(0, Math.min(999, Math.floor(Number(el.value)) || 0)); },
  txDate(el) { S.txv.date = el.value; loadTx(); },
  arcTxDays(el) { arcSet({ txDays: Number(el.value) }); },
  arcHist(el) { arcSet({ histMonths: Number(el.value) }); },
  arcAuto(el) { arcSet({ auto: !!el.checked }); },
  arcKind(el) { ARC.kind = el.value; ARC.month = ''; ARC.found = null; renderPanel(); },
  arcMonth(el) { ARC.month = el.value; },
  arcQ(el) { ARC.q = el.value; },
  stDate(el) { S.settle.date = el.value; loadSettle(); },
  rpFrom(el) { S.settle.from = el.value; },
  rpTo(el) { S.settle.to = el.value; },
  rcvMemo(el) { S.rcv.memo = el.value; },
  stkName(el) { S.stk.name = el.value; },
  stkAct(el) { const l = S.stk.lines[Number(el.dataset.i)]; if (l) l.actual = Math.max(0, Math.floor(Number(el.value)) || 0); },
  impText() { },
  setVal() { },
  cfgGas(el) { S.cfg.gas = el.value.trim(); saveCfg(); updateGasErr(); reloadMasterSoon(); },
  cfgToken(el) { S.cfg.token = el.value; saveCfg(); reloadMasterSoon(); },
  cfgSw(el) { S.cfg[el.dataset.key] = el.checked; saveCfg(); if (el.dataset.key === 'kbd') applyKbd(); }
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.tagName === 'BUTTON' && b.disabled) return;
  unlockMedia();
  const f = Actions[b.dataset.act]; if (f) f(b.dataset, e);
});
document.addEventListener('input', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.in; if (!k || !Inputs[k]) return;
  if (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') return;
  Inputs[k](el);
});
document.addEventListener('change', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.in; if (!k || !Inputs[k]) return;
  if (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') Inputs[k](el);
});
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal' && !S.dlgResolve) { S.co = null; closeModal(); } });
$('#manualJan').addEventListener('keydown', (e) => { if (e.key === 'Enter') Actions.manualJan(); });
$('#photoIn').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; readPhoto(f); });
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'impFile') return;
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const text = Logic.decodeBytes(await f.arrayBuffer()); const ta = $('#impText'); if (ta) { ta.value = text; toast('ファイルを読み込みました。「取り込む」で反映します'); } }
  catch (err) { toast('ファイルを読めません：' + err.message, 'bad'); }
});

/* ---------- PWA ---------- */
function setupManifest() {
  try {
    const icon = document.querySelector('link[rel=icon]').href;
    const m = { name: '簡易POS', short_name: '簡易POS', display: 'standalone', orientation: 'portrait',
      start_url: location.href.split('#')[0], scope: location.href.split('#')[0].replace(/[^/]*$/, ''),
      background_color: '#0f766e', theme_color: '#0f766e', icons: [{ src: icon, sizes: '180x180', type: 'image/png', purpose: 'any' }] };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    document.head.appendChild(l);
  } catch (e) { }
}

/* ---------- 起動 ---------- */
function applyFragment() {
  const frag = Logic.parseFragment(location.hash);
  if (!frag) return false;
  if (frag.gas) S.cfg.gas = frag.gas;
  if (frag.token) { S.cfg.token = frag.token; setTimeout(() => toast('リンクに合言葉が含まれていました。このリンクは他の人に送らないでください（初回設定は手入力が安全です）', 'warn'), 600); }
  saveCfg();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
  return true;
}
window.addEventListener('hashchange', () => { if (applyFragment()) { toast('設定を取り込みました', 'ok'); loadMaster(); loadSettings(); } });

(function init() {
  applyFragment(); applyKbd(); setupManifest(); setCam('off'); renderStatus(); renderPanel();
  if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch (e) { } }
  if (S.cfg.gas) { loadMaster(); loadSettings(); if (S.mode === 'tx') loadTx(); if (S.mode === 'settle') loadSettle(); if (S.mode === 'arc') loadArc(); }
  window.__pos = { S: S, Logic: Logic, Actions: Actions, api: api, onScan: onScan };
})();

</script>
</body>
